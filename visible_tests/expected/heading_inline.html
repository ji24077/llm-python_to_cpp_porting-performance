<h1>Top Level Heading</h1>
<p>A paragraph with <em>italic</em>, <em>also italic</em>, <strong>bold</strong>, and <strong>also bold</strong> text.</p>
<h2>Second Level</h2>
<p>Inline code like <code>print(&quot;hi&quot;)</code> should be rendered verbatim.</p>
<h3>Third Level</h3>
<p>Mixing <strong>bold with <code>code</code> inside</strong> and <em>emphasis with a word</em> here.</p>
